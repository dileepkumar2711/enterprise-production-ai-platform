apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-production-ai-platform
  labels:
    app: enterprise-production-ai-platform
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: enterprise-production-ai-platform

  template:
    metadata:
      labels:
        app: enterprise-production-ai-platform
    spec:
      securityContext:
       runAsNonRoot: true
       runAsUser: 100
       runAsGroup: 101
       seccompProfile:
        type: RuntimeDefault 
      containers:
        - name: production-ai-api
          image: enterprise-production-ai-platform:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: production-ai-config

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL