apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: production-ai-platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dileepkumar2711/enterprise-production-ai-platform.git
    targetRevision: main
    path: helm/production-ai-platform

    helm:
      releaseName: production-ai-gitops

  destination:
    server: https://kubernetes.default.svc
    namespace: production-ai

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true